basePath: /
definitions:
  services.capabilitiesResponse:
    properties:
      passthrough_video_codecs:
        description: 'PassthroughVideoCodecs is sorted and never null: [] passes none.'
        items:
          type: string
        type: array
    type: object
  services.sessionCreateResponse:
    properties:
      duration:
        type: number
      id:
        type: string
      route_reason:
        description: |-
          RouteReason is why, one of a closed set (services/route.go): ok for
          passthrough; no_declaration, passthrough_off, not_hevc, needs_2160,
          needs_pq and the like for the old route.
        type: string
      video_route:
        description: |-
          VideoRoute is what the session does with the video: passthrough,
          copy, reencode, or audio for a source without one.
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: HTTP stream to HLS transcoder with session-based seek support. Each
    viewer creates a session which manages one HLS stream with FFmpeg. Multiple sessions
    for the same content share FFmpeg processes.
  title: Content Transcoder API
  version: "1.0"
paths:
  /capabilities:
    get:
      description: Which source video codecs a session opened now hands to the player
        as they are (HEVC passthrough). Re-read from the capability file like POST
        /session; the route itself is decided per session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.capabilitiesResponse'
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Transcoder capabilities
      tags:
      - capabilities
  /session:
    post:
      description: Creates a new session, probes media, starts FFmpeg from position
        0
      parameters:
      - description: Source media URL (alternative to X-Source-Url header)
        in: query
        name: source_url
        type: string
      - description: Source media URL (takes priority over query param)
        in: header
        name: X-Source-Url
        type: string
      - description: 'What the client decodes, comma-separated tokens: hevc8, hevc10,
          hevc8-2160, hevc10-2160, hevc-high, hdr-pq; or unknown'
        in: query
        name: decode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.sessionCreateResponse'
        "400":
          description: Missing or invalid source_url
          schema:
            type: string
        "415":
          description: Source cannot be transcoded (resolution over 1080p or transcoding
            disabled); reason in X-Video-Route-Reason
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
        "503":
          description: The source could not be checked (source check failed); retry,
            see Retry-After
          schema:
            type: string
      summary: Create transcoding session
      tags:
      - session
  /session/{sessionId}:
    delete:
      description: Stops FFmpeg, releases shared run, removes session directory
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "404":
          description: Session not found
          schema:
            type: string
      summary: Close session
      tags:
      - session
  /session/{sessionId}/{segment}:
    get:
      description: 'Returns a .ts or .vtt segment (a passthrough session: .m4s segments
        and <stream>-init-<generation>.mp4 init segments, video/mp4). Waits for file
        to appear if FFmpeg hasn''t produced it yet. Auto-restarts FFmpeg if it was
        stopped.'
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Segment filename (e.g., v0-720-0.ts, a0-5.ts)
        in: path
        name: segment
        required: true
        type: string
      produces:
      - video/mp2t
      responses:
        "200":
          description: Segment data
          schema:
            type: file
        "404":
          description: Session not found
          schema:
            type: string
        "504":
          description: Timeout waiting for segment
          schema:
            type: string
      summary: Get HLS segment
      tags:
      - session
  /session/{sessionId}/{stream}.m3u8:
    get:
      description: Returns master playlist (index.m3u8) or variant EVENT playlist.
        Query params are appended to all file references for auth forwarding.
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Playlist name (index.m3u8, v0-720.m3u8, a0.m3u8, etc.)
        in: path
        name: stream
        required: true
        type: string
      produces:
      - application/vnd.apple.mpegurl
      responses:
        "200":
          description: HLS playlist
          schema:
            type: string
        "404":
          description: Session or playlist not found
          schema:
            type: string
        "504":
          description: Timeout waiting for playlist
          schema:
            type: string
      summary: Get HLS playlist
      tags:
      - session
  /session/{sessionId}/seek:
    get:
      description: Returns the movie time this session's media time 0 maps to
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: float64
              type: number
            type: object
        "404":
          description: Session not found
          schema:
            type: string
      summary: Get current seek offset
      tags:
      - session
    post:
      description: Stops current FFmpeg run and starts new one from target position.
        Seek times are quantized to 30s boundaries.
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      - description: Target seek time in seconds
        in: query
        name: t
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Missing or invalid t parameter
          schema:
            type: string
        "404":
          description: Session not found
          schema:
            type: string
        "500":
          description: Seek failed
          schema:
            type: string
      summary: Seek to position
      tags:
      - session
swagger: "2.0"
